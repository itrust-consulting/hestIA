services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile  # Path to your Python Dockerfile
    ports:
      - "5555:5555"
    volumes:
      - ./app/data:/var/lib/itrust/app/data
    networks:
      - app_network
    environment:
      - 'PORT=5555'
      - 'LLM_URL=${LLM_URL:-http://localhost:8000}'
      - 'LLM_API_KEY=${LLM_API_KEY}'
      - 'DB_URL=${DB_URL:-http://localhost:6333}'
      - 'DB_API_KEY=${DB_API_KEY}'
      - 'DEFAULT_GEN_MODEL=RedHatAI/Qwen3.6-35B-A3B-NVFP4'
      - 'DEFAULT_EMB_MODEL=Qwen/Qwen3-Embedding-0.6B'
      - 'ENABLE_AUTH=true'
      - 'AUTH_PW_LENGTH=15'
      - 'AUTH_MAX_ATTEMPTS=5'
      - 'AUTH_LOCKOUT_DURATION=15'
      - 'AUTH_MODE=oidc'
      - 'OIDC_PROVIDER_URL=https://login.com/realms/identity'
      - 'OIDC_CLIENT_ID=hestia'
      - 'OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}'
      - 'AUTH_SECRET_KEY=${AUTH_SECRET_KEY}'
      - 'AUTH_TOKEN_LIFETIME=360'
      # Break-glass local admin, created once on first boot if the user
      # database is empty (see hestia/container.py:_bootstrap_admin_user).
      - 'DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}'
      - 'DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}'
      - 'DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}'
      - 'LOG_LEVEL=INFO'
      # Relative to app_data.parent (see Settings.load()) -- resolves to
      # app_data/logs, i.e. inside the ./app/data volume mount below, so log
      # files actually survive container recreation. The old default
      # (app_data.parent/"logs") was a sibling of app/data, outside any mount.
      - 'LOG_DIR=data/logs'
 
  frontend:
    build:
      context: ./hestia-ui
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    depends_on:
      - backend
    volumes:
      - ./frontend-data/manual:/app/data/manual
    networks:
      - app_network
    environment:
      - 'PRIVATE_MICROSERVICE_URL=http://backend:5555'
      - 'PRIVATE_HELP_DATA_DIR=/app/data/manual'
      - 'PUBLIC_AUTH_MODE=oidc'
      - 'PORT=7860'
 

networks:
  app_network:
    driver: bridge