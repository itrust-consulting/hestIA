services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile  # Path to your Python Dockerfile
    ports:
      - "5555:5555"
    volumes:
      - ./app/data:/var/lib/itrust/app/data
    networks:
      - app_network
    environment:
      - 'PORT=5555'
      - 'LLM_URL=${LLM_URL:-http://host.docker.internal:8000}'
      - 'DB_URL=${DB_URL:-http://host.docker.internal:6333}'
      - 'DEFAULT_GEN_MODEL=${DEFAULT_GEN_MODEL:?set to a model name your LLM_URL serves, e.g. ministral-3:14b}'
      - 'DEFAULT_EMB_MODEL=${DEFAULT_EMB_MODEL:-Qwen/Qwen3-Embedding-0.6B}'
      - 'AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?set to a random 32+ char secret, e.g. python -c "import secrets; print(secrets.token_hex(32))"}'
      - 'DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:?set the bootstrap admin username}'
      - 'DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?set the bootstrap admin password, >=15 chars}'
      - 'DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:?set the bootstrap admin email}'
      - 'LOG_LEVEL=INFO'
      - 'LOG_DIR=data/logs'

  frontend:
    build:
      context: ./hestia-ui
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    depends_on:
      - backend
    volumes:
      - ./frontend-data/manual:/app/data/manual
    networks:
      - app_network
    environment:
      # adapter-node (hestia-ui/Dockerfile's CMD) listens on PORT=3000 by
      # default -- without this, the "7860:7860" mapping above points at
      # nothing inside the container.
      - 'PORT=7860'
      - 'PRIVATE_MICROSERVICE_URL=http://backend:5555'
      - 'PRIVATE_HELP_DATA_DIR=/app/data/manual'
 
networks:
  app_network:
    driver: bridge