entrypoint: Encode1
exitpoint:  [Chat1]

include:
  - ../base/encode_dense.yaml
  - ../base/encode_sparse.yaml
  - ../base/retrieve.yaml
  - ../base/chat.yaml

nodes:
  - use: encode_dense.yaml
    with:
      id: Encode1
      inputs:
        data: ${last_user_message}
        # The admin-configured embedding connection's model/params -- NOT
        # ${model}/${model_kwargs}, which are the request's chat/generation
        # model and would misdirect it at the embeddings endpoint.
        model: ${embedding_model}
        model_kwargs: ${embedding_model_kwargs}
      outputs:
        vector: dense_vector

  - use: encode_sparse.yaml
    with:
      id: Encode2
      inputs:
        data: ${last_user_message}
        collection: ${collection}
      outputs:
        vector: sparse_vector

  - use: retrieve.yaml
    with:
      id: Retrieve1
      inputs:
        dense: ?dense_vector
        sparse: ?sparse_vector
        collection: ${collection}
        options: ${query_kwargs}
      outputs:
        hits: points

  - id: Augment1
    type: Augment
    inputs:
      # Retrieval query and generation prompt both stay pure typed text --
      # attachments are threaded separately below (attachments/
      # ${attached_documents}) so a file's content reaches the LLM without
      # ever being folded into what Encode1/Encode2 embed for search.
      prompt: ${last_user_message}
      hits:   ?points
      attachments: ${attached_documents}
      # Admin-editable RAG system prompt -- this is what the LLM actually
      # sees, wrapping the retrieved context and citation-key instructions
      # around the user's message. Only {user_prompt} is required (omitting
      # it silently drops the user's question); {retrieved_data} and
      # {source_map} are just how this template happens to surface retrieved
      # context/citations and can be reworked or dropped.
      # {attached_documents} is optional -- resolves to "" when the user
      # attached no files -- but keep it if you want attachments (which the
      # user provided directly, not via the knowledge base) to actually
      # reach the model.
      template: |
        You are an assistant with access to an organizations ISMS knowledge base of Markdown documents.
        Below are the most relevant excerpts retrieved from that database.

        <retrieved-data>
            {retrieved_data}
        </retrieved-data>

        <source-map>
            {source_map}
        </source-map>

        <attached-documents>
            {attached_documents}
        </attached-documents>

        Instruction:
        - Use LaTeX-style citations when referencing retrieved data: \cite{{key}} for a single source,
          or \cite{{key1,key2}} for multiple sources.
        - IMPORTANT: Use ONLY the numeric keys defined in <source-map>. Do NOT derive keys from
          filenames, document titles, or any other source. The keys are short integers (1, 2, 3, ...).
        - <attached-documents>, if non-empty, holds file(s) the user attached directly to this
          message -- they are not part of the knowledge base and are not in <source-map>, so do NOT
          invent a citation key for them; just use their content directly when relevant.
        - If the retrieved data is insufficient, say so explicitly.
        - Do NOT include a separate sources or references section at the end.

        <user-prompt>
            {user_prompt}
        </user-prompt>
    outputs:
      prompt: aug_message

  - use: chat.yaml
    with:
      id: Chat1
      inputs:
        history: ${history}
        last_user_message: ?aug_message
        model: ${model}
        options: ${model_kwargs}
      outputs:
        response: response
