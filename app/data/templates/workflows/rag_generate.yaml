entrypoint: Encode1
exitpoint:  [Generate1]

include:
  - ../base/encode_dense.yaml
  - ../base/encode_sparse.yaml
  - ../base/retrieve.yaml
  - ../base/generate.yaml

nodes:
  - use: encode_dense.yaml
    with:
      id: Encode1
      inputs:
        data: ${prompt}
        # The admin-configured embedding connection's model/params -- NOT
        # ${model}/${model_kwargs}, which are the request's generation
        # model and would misdirect it at the embeddings endpoint.
        model: ${embedding_model}
        model_kwargs: ${embedding_model_kwargs}
      outputs:
        vector: dense_vector

  - use: encode_sparse.yaml
    with:
      id: Encode2
      inputs:
        data: ${prompt}
        collection: ${collection}
      outputs:
        vector: sparse_vector

  - use: retrieve.yaml
    with:
      id: Retrieve1
      inputs:
        dense: ?dense_vector
        sparse: ?sparse_vector
        collection: ${collection}
        options: ${query_kwargs}
      outputs:
        hits: points

  - id: Augment1
    type: Augment
    inputs:
      prompt: ${prompt}
      hits:   ?points
      # Admin-editable RAG system prompt -- must keep all three placeholders
      # ({retrieved_data}, {source_map}, {user_prompt}); this is what the
      # LLM actually sees, wrapping the retrieved context and citation-key
      # instructions around the user's message.
      template: |
        You are an assistant with access to an organizations ISMS knowledge base of Markdown documents.
        Below are the most relevant excerpts retrieved from that database.

        <retrieved-data>
            {retrieved_data}
        </retrieved-data>

        <source-map>
            {source_map}
        </source-map>

        Instruction:
        - Use LaTeX-style citations when referencing retrieved data: \cite{{key}} for a single source,
          or \cite{{key1,key2}} for multiple sources.
        - IMPORTANT: Use ONLY the numeric keys defined in <source-map>. Do NOT derive keys from
          filenames, document titles, or any other source. The keys are short integers (1, 2, 3, ...).
        - If the retrieved data is insufficient, say so explicitly.
        - Do NOT include a separate sources or references section at the end.

        <user-prompt>
            {user_prompt}
        </user-prompt>
    outputs:
      prompt: aug_prompt

  - use: generate.yaml
    with:
      id: Generate1
      inputs:
        prompt: ?aug_prompt
        model: ${model}
        options: ${model_kwargs}
      outputs:
        response: response
