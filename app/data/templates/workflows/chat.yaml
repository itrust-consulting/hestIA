entrypoint: Chat1
exitpoints: [Chat1]

include:
  - ../base/chat.yaml

nodes:
  - use: chat.yaml
    with:
      id: Chat1
      inputs:
        history: ${history}
        # Attachments never went through retrieval in this template anyway
        # (no Encode/Retrieve nodes here) -- merge them into the LLM-facing
        # message so a file attached during a no-retrieval turn (no
        # collection, or no typed text -- see chat.py's routing) still
        # reaches the model's context.
        last_user_message: "${attached_documents}\n\n${last_user_message}"
        model: ${model}
        options: ${model_kwargs}
      outputs:
        response: response
