<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1043px" preserveAspectRatio="none" style="width:498px;height:1043px;background:#FFFFFF;" version="1.1" viewBox="0 0 498 1043" width="498px" zoomAndPan="magnify"><defs/><g><ellipse cx="331.2451" cy="15" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="284.8965" x="188.7969" y="45"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="221.5371" x="198.7969" y="67.0645">Moderator submits ingestion request</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="264.8965" x="198.7969" y="81.6484">(file, collection, classification level, tenants)</text><rect fill="#F5F5F5" height="34.584" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="242.4629" x="210.0137" y="114.168"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="222.4629" x="220.0137" y="136.2324">FC-01 authenticates request (FC-02)</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="243.2832" x="209.6035" y="168.752"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="220.0371" x="219.6035" y="190.8164">FC-03 validates moderator authority</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="223.2832" x="219.6035" y="205.4004">(role check + active collection grant)</text><path d="M5,227.9199 L5,301.1172 L283.626,301.1172 L283.626,237.9199 L273.626,227.9199 L5,227.9199" fill="#FFFDE7" style="stroke:#CCBB55;stroke-width:1;"/><path d="M273.626,227.9199 L273.626,237.9199 L283.626,237.9199 L273.626,227.9199" fill="#FFFDE7" style="stroke:#CCBB55;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="220.8286" x="11" y="245.9897">Optionally preview document first</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="257.626" x="11" y="261.7891">via FC-11 Document Preview &#8212; inspect</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="210.7612" x="11" y="277.5884">extracted metadata and content</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="119.8247" x="11" y="293.3877">before committing</text><rect fill="#F5F5F5" height="34.584" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="165.0605" x="248.7148" y="349.8015"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="145.0605" x="258.7148" y="371.866">Reject &#8212; 403 Forbidden</text><ellipse cx="331.2451" cy="423.5935" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="331.2451" cy="423.5935" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#F5F5F5" points="295.626,301.1172,366.8643,301.1172,378.8643,313.1172,366.8643,325.1172,295.626,325.1172,283.626,313.1172,295.626,301.1172" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="14.9048" x="335.2451" y="336.1763">No</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="71.2383" x="295.626" y="317.8896">Authorised?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="19.0513" x="378.8643" y="310.8076">Yes</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="294.5938" x="183.9482" y="476.5935"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="274.5938" x="193.9482" y="498.658">User supplies or confirms metadata overrides</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="245.8887" x="193.9482" y="513.2419">(title, subject, classification, source URI)</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="267.7109" x="197.3896" y="545.7615"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="143.625" x="207.3896" y="567.8259">FC-06 parses document</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="247.7109" x="207.3896" y="582.4099">(text + structure + metadata extraction)</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="256.9004" x="202.7949" y="614.9294"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="221.7422" x="212.7949" y="636.9939">FC-06 segments content into chunks</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="236.9004" x="212.7949" y="651.5779">(section boundaries + navigation links)</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="321.5762" x="170.457" y="684.0974"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="162.1289" x="180.457" y="706.1619">FC-06 encodes each chunk</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="301.5762" x="180.457" y="720.7458">(dense semantic vector + sparse keyword vector)</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="316.9414" x="172.7744" y="753.2654"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="296.9414" x="182.7744" y="775.3298">FC-06 stores encoded chunks in Vector Database</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="287.5898" x="182.7744" y="789.9138">(vectors + metadata + classification attributes)</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="209.6914" x="226.3994" y="822.4333"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="189.6914" x="236.3994" y="844.4978">System reports ingestion result</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="170.3496" x="236.3994" y="859.0818">(chunk count, elapsed time)</text><rect fill="#F5F5F5" height="34.584" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="175.2852" x="243.6025" y="891.6013"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="155.2852" x="253.6025" y="913.6658">FC-18 records audit entry</text><rect fill="#F5F5F5" height="49.168" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="214.3027" x="224.0938" y="946.1853"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="183.1523" x="234.0938" y="968.2498">Content immediately available</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="194.3027" x="234.0938" y="982.8337">for retrieval by authorised users</text><ellipse cx="331.2451" cy="1026.3533" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="331.2451" cy="1026.3533" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="331.2451" x2="331.2451" y1="25" y2="45"/><polygon fill="#444444" points="327.2451,35,331.2451,45,335.2451,35,331.2451,39" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="331.2451" x2="331.2451" y1="94.168" y2="114.168"/><polygon fill="#444444" p