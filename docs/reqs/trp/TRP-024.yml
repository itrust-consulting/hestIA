  # TCER: TST-024 (Moderator tenant management)

  ## Relevant test environment and configuration details

  - Software deviations: aligned with test case specification, N/A
  - Hardware deviations: aligned with test case specification, N/A
  - Setup: Executed steps 1-7 of TST-023 (tenant 'TEST' configured with 'User'
    as member and 'Moderator' as moderator). Unassigned user 'Invitee' available
    with a known email. Logged in as 'Moderator'.

  ## Test execution results

  **Test case step 1-2 (navigate to Tenants and check visibility)**:
  - Moderator dashboard lists strictly the assigned tenant 'TEST'; unassigned
    tenants are hidden. ?c5-defect-0

  **Test case step 3 (inspect tenant 'TEST')**:
  - Tenant info, current members, and assigned collections rendered correctly.
    ?c5-defect-0

  **Test case step 4-5 (modify tenant information and save changes)**:
  - Tenant information successfully updated and saved changes confirmed. ?c5-defect-0

  **Test case step 6-7 (invite 'Invitee' by email and verify pending state)**:
  - Invitation sent to 'Invitee' email; pending status correctly listed in the
    UI. ?c5-defect-0

  **Test case step 8 (remove 'User' from tenant)**:
  - 'User' removed from tenant without issue. ?c5-defect-0

  **Test case step 9-11 (create collection 'test-collection_2' and verify listing)**:
  - Collection created and listed under the tenant's collections. ?c5-defect-0

  **Test case step 12 (delete collection via tenant profile)**:
  - Collection deleted from tenant. ?c5-defect-0

  **Test case step 13 (inspect admin audit logs for moderator actions)**:
  - Audit log entries present for tenant modification, user invitation, member
    removal, and collection creation. No audit log entry was produced for the
    collection deletion. ?c5-defect-1

  ### Defect summary description

  Defect category: ?c5-defect-1 (negligible defect).
  All moderator actions were correctly audited except collection deletion, which
  produced no audit log entry. Collection creation is logged (collection_create)
  but the corresponding deletion is not, leaving no trace of the removal.

