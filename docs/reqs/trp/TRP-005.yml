  # TCER: TST-005 (LDAP authentication)

  ## Relevant test environment and configuration details

  - Software deviations: aligned with test case specification, N/A
  - Hardware deviations: aligned with test case specification, N/A
  - Method: automated black-box run, `pytest tests_integration/test_tst005_ldap_authentication.py -v`.
    The instance under test is configured with AUTH_MODE=oidc, not ldap, and
    no `HESTIA_LDAP_TEST_USERNAME`/`_PASSWORD` were supplied -- both are
    required preconditions for this TST (a reachable LDAP directory with a
    known test user) that this environment does not provide.

  ## Test execution results

  **Test case step 1 (log in using the LDAP test user's directory credentials)**:
  - `test_valid_ldap_user_authenticates` SKIPPED -- no LDAP test credentials
    configured for this environment. ?c5-defect-0

  **Test case step 2 (incorrect password for the same LDAP user is rejected)**:
  - `test_incorrect_password_rejected` SKIPPED, same reason. ?c5-defect-0

  **Test case step 3 (nonexistent LDAP username is rejected)**:
  - `test_nonexistent_ldap_username_rejected` SKIPPED, same reason. ?c5-defect-0

  ### Defect summary description

  Not executed against this environment: defect category ?c5-defect-0 (no
  defect -- the suite skips cleanly by design when LDAP isn't configured,
  per `tests_integration/README.md`, rather than failing).

  ### Test execution evidence

  `3 skipped` (see the full-suite summary referenced in TRP-004).

  ### Comments

  This is an environment-applicability gap, not a product defect: the
  currently deployed instance runs AUTH_MODE=oidc. Re-run against an
  instance configured with AUTH_MODE=ldap and a reachable test directory
  (`HESTIA_LDAP_TEST_USERNAME`/`_PASSWORD`) to actually exercise this TST.

