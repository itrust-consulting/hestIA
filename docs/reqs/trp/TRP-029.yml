text: |
  # TCER: TST-029 (Backend configuration)

  ## Relevant test environment and configuration details

  - Software deviations: aligned with test case specification, N/A
  - Hardware deviations: aligned with test case specification, N/A
  - Setup: hestIA initially configured with the default (OpenAI-compatible/vLLM)
    generation and embedding connections; an Ollama server reachable on the
    network with both a generation model and an embedding model pulled.

  ## Test execution results

  **Test case step 1 (navigate to admin dashboard > connections)**:
  - ?c5-defect-0

  **Test case step 2 (add an Ollama API Connection for generation and one for embedding)**:
  - Both connections added successfully. ?c5-defect-0

  **Test case step 3 (activate the Ollama API Connections)**:
  - Activation took effect without a backend restart. ?c5-defect-0

  **Test case step 4 (navigate to chat interface, start a new conversation)**:
  - ?c5-defect-0

  **Test case step 5 (verify response is generated by the Ollama server, log inspection)**:
  - Ollama server log confirmed the request was served locally
    (POST /api/chat, 200). ?c5-defect-0

  **Test case step 6 (navigate to admin dashboard > collections)**:
  - ?c5-defect-0

  **Test case step 7 (create a new collection and upload a document)**:
  - ?c5-defect-0

  **Test case step 8 (verify the Ollama embedding connection was used to embed
  document chunks, log inspection)**:
  - Confirmed via log inspection. ?c5-defect-0

  **Test case step 9 (optional: reactivate the default OpenAI API connections)**:
  - Reactivation took effect live. ?c5-defect-0

  **Test case step 10 (minimum temperature, same prompt submitted three times)**:
  - The three repeated submissions produced consistent output at minimum
    temperature. ?c5-defect-0

  **Test case step 11 (adjust generation parameters -- model, temperature,
  maximum output length -- to different values)**:
  - Parameters changed on the active Ollama generation connection: temperature
    0.5, top_p 0.2, top_k 5, num_predict (maximum output length) 50.
    ?c5-defect-0

  **Test case step 12 (return to chat interface, continue conversation)**:
  - ?c5-defect-0

  **Test case step 13 (verify generation parameters have been adopted, log inspection)**:
  - Ollama server log confirmed temperature/top_p/top_k applied exactly as
    configured (sampler params: top_k = 5, top_p = 0.200, temp = 0.500).
    num_predict was verified separately and confirmed to cap output at the
    configured length. ?c5-defect-0

  ### Defect summary description

  Defect-free test execution, i.e., defect category: ?c5-defect-0.
  Switching the active backend to Ollama (both generation and embedding)
  succeeded, and chat/ingestion continued to function correctly; reverting to
  the default connections likewise succeeded. Generation parameter changes
  (model, temperature, top_p, top_k, maximum output length) took effect live,
  on the next request, without a backend restart, and were confirmed applied
  via Ollama server log inspection.

  ### Test execution evidence

  Ollama server log excerpt (step 13), sampler parameters matching the
  configured values:

  top_k = 5, top_p = 0.200, min_p = 0.000, xtc_probability = 0.000,
  xtc_threshold = 0.100, typical_p = 1.000, top_n_sigma = -1.000, temp = 0.500
  [GIN] POST "/api/chat" | 200

  ### Comments

  No deviations from expected outcomes. Ad-hoc testing ahead of this formal
  run had surfaced a defect where the frontend sent a hardcoded generation
  model on every chat request, causing Ollama to 404 once its active model
  differed from that hardcoded value; this was root-caused and fixed prior to
  this TCER (see the corresponding GitLab issue for defect history). This
  execution reflects the corrected behaviour only.

  ## Guide

  - Defect category: ?c5-defect-0; ?c5-defect-1; ?c5-defect-2; ?c5-defect-3; ?c5-defect-4
