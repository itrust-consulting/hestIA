  # TCER: TST-027 (Collection management - Batch ingestion)

  ## Relevant test environment and configuration details

  - Software deviations: aligned with test case specification, N/A
  - Hardware deviations: aligned with test case specification, N/A
  - Setup: Precondition TST-025 executed. Target collection active. Test batch includes valid files and one corrupt file.

  ## Test execution results

  **Test case step 1-4 (batch auto-upload with valid documents)**:
  - Valid documents imported in a single batch operation without individual prompts. ?c5-defect-0

  **Test case step 5 (corrupt file handling and error reporting)**:
  - Corrupt file did not block batch execution, but no error or audit log was emitted for the unparsed file. ?c5-defect-1

  **Test case step 6 (delete uploaded files)**:
  - Batch documents deleted successfully. ?c5-defect-0

  **Test case step 7-10 (batch upload with 'Review each file' option)**:
  - Valid files batch imported with manual metadata review and saved successfully. ?c5-defect-0

  **Test case step 11 (inspect audit logs)**:
  - Audit logs verified for successful ingestions, but no log entry was generated for the failed corrupt file. ?c5-defect-1

  ### Defect summary description

  Defect category: ?c5-defect-1 (minor defect).
  The corrupt/unparseable file was correctly excluded from ingestion without blocking the batch, but system audit logs did not produce a failure entry for the corrupt file.

  ### Test execution evidence

  Batch document ingestion log 1:
  ingestion_done
  Fields
  {
    "collection": "test-coll-2",
    "source": "hestia_issues",
    "n_chunks": 3,
