  # TCER: TST-011 (Admin password reset)

  ## Relevant test environment and configuration details

  - Software deviations: aligned with test case specification, N/A
  - Hardware deviations: aligned with test case specification, N/A
  - Setup: logged in as admin; a standard test user exists with a known
    password.

  ## Test execution results

  **Test case step 1 (admin dashboard > Users, open the test user)**:
  - ?c5-defect-0

  **Test case step 2 (set a new password via the admin reset action,
  without knowing the current password)**:
  - Reset succeeded. ?c5-defect-0

  **Test case step 3 (log out, log in as the test user with the admin-set
  password)**:
  - Authenticated successfully. ?c5-defect-0

  **Test case step 4 (attempt to log in with the old password)**:
  - Old password no longer authenticates. ?c5-defect-0

  **Test case step 5 (as a standard user, attempt to reset another user's password)**:
  - Denied. ?c5-defect-0

  **Test case step 6 (inspect logs for the admin reset and the denied attempt)**:
  - Both the admin's password reset and the denied non-admin attempt are
    correctly recorded as audit entries. ?c5-defect-0

  ### Defect summary description

  Defect-free test execution, i.e., defect category: ?c5-defect-0. An admin
  can reset any user's password without knowing the current one, the new
  password works and the old one is invalidated, a non-admin is denied the
  same action, and both the reset and the denial are correctly audited.

