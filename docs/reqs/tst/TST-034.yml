text: |
  ## Preconditions and setup actions
  - hestIA is deployed with the LLM and Qdrant services active
  - The user is authenticated
  - A test collection with a known document is available

  ## Test steps
  1. Call POST /generate with exec_type=generate, a prompt, a custom system_prompt, and no collection. Confirm the response is a direct LLM completion that follows the system_prompt without citing any documents.
  2. Call POST /generate with exec_type=rag_generate, the same prompt, the test collection, and the same system_prompt. Confirm the response includes citations referencing the test document.
  3. Confirm that the RAG generate response is more specific or accurate regarding corpus content than the plain generate response from step 1.
  4. Call POST /generate with exec_type=rag_generate and a question with no relevant content in the corpus. Confirm the response acknowledges the absence of relevant content rather than fabricating an answer.
  5. Call POST /generate with exec_type=generate and generation parameters (e.g. temperature=0.0, max_tokens=50). Confirm the response length is constrained to the specified max_tokens.

  ## Expected outcome
  1. Plain generate returns a direct LLM response with no citations.
  2. RAG generate returns a response with at least one citation from the test collection.
  3. RAG response demonstrates corpus grounding compared to plain generate.
  4. RAG generate returns an honest response when no relevant context is available.
  5. Generation parameters are respected in the output.
