text: |
  ## Preconditions and setup actions
  - Access to the deployed vector store (Qdrant) and embedding-storage configuration, and to Qdrant's published documentation/benchmarks for collection size and performance at scale.
  - hestIA's actual per-document/per-chunk storage footprint (vector dimensionality, payload size) is known or can be estimated from a smaller ingested sample.

  ## Test steps
  1. Review Qdrant's documentation and published benchmarks for supported collection sizes, storage engine behavior (e.g., on-disk vs. in-memory indexes, quantization), and query latency at scale, and confirm they cover corpora at least as large as 100 GB of vector + payload data.
  2. Using hestIA's measured or estimated per-document storage footprint, extrapolate the vector count and on-disk size corresponding to a 100 GB source corpus, and compare against the reviewed Qdrant capacity guidance.
  3. Review hestIA's Qdrant deployment configuration (indexing mode, memory/disk settings, sharding if any) against Qdrant's recommendations for the extrapolated scale, and identify any configuration that would need to change to sustain it.
  4. Ingest a smaller representative sample corpus (e.g., a few GB) and confirm ingestion completes without errors and queries return relevant results within acceptable response times, to validate the extrapolation is grounded in observed behavior rather than documentation alone.
  5. Record findings, including any configuration change or resource provisioning identified as necessary to reach 100 GB, and any risk or unknown that a full-scale test would be needed to resolve.

  ## Expected outcome
  1. Qdrant's documented capabilities support collections at least as large as the extrapolated 100 GB scenario.
  2. The extrapolated storage and query-performance characteristics at 100 GB are consistent with Qdrant's documented behavior and with the smaller-scale sample run.
  3. hestIA's current Qdrant deployment configuration is either already suitable for this scale, or the required configuration changes are identified and documented.
  4. Any residual risk that can only be resolved by an actual full-scale (100 GB) run is explicitly recorded as an open item rather than left implicit.
