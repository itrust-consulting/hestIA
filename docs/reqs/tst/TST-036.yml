expected_outcome: |
  Conversations under the configured context-token budget are sent to the model unmodified. Conversations that exceed the budget have their oldest turns folded into an LLM-generated rolling summary while the most recent messages are always kept verbatim; the summary and its boundary are persisted and reused (merged, not regenerated) on subsequent turns. The kept tail never starts mid-exchange. Streaming requests surface a distinct "compacting" status before content begins. Summarization failures never break the underlying chat/generate request (fail-open).
header: |
  Verify automatic conversation context-budget management (summarization/compaction of long chat history)
