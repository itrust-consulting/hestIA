text: |
  ## Preconditions and setup actions
  - System initialized.
  - Valid API access token available.
  - Target collection exists.

  ## Test steps
  1. Submit a single document, the target collection, and a classification level to the ingestion API endpoint.
  2. Inspect the API response and confirm it indicates the document was accepted, with its ingestion status.
  3. Submit an ingestion request with a missing or invalid parameter (e.g., unknown collection) and verify the API returns a clear error.
  4. Once ingestion completes, query the target collection through the chat interface and verify the document's content is retrievable.

  ## Expected outcome
  1. A document is ingested into the target collection through a single API call, without using the web interface.
  2. The API response accurately reflects ingestion success or failure.
  3. The ingested document is queryable through the chat interface with the same behavior as a document ingested through the UI.
