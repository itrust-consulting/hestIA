text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running with the LLM service active
  - An analyst user is authenticated
  - A collection with ingested content is available
  - The test prompt and expected response characteristics are documented

  ## Test steps
  1. Query the system to retrieve the list of available models. Confirm models are listed without requiring external documentation.
  2. Submit the test prompt twice with temperature set to its minimum value (0.0 or equivalent). Compare the two responses.
  3. Submit the test prompt with max_tokens set to 50. Record the approximate response length.
  4. Submit the same prompt with max_tokens set to 500. Compare the response length to step 3.

  ## Expected outcome
  1. Available models are returned by the system without consulting external sources.
  2. Two identical prompts at minimum temperature produce consistent (identical or near-identical) responses.
  3. A max_tokens value of 50 produces a measurably shorter response than 500 tokens.
