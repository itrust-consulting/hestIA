text: |
  ## Preconditions and setup actions
  - TST-025
  - The collection to be deleted has at least one tenant access grant beyond its owner (e.g., granted in TST-025).

  ## Test steps
  1. Select the 'Sync Folder' icon.
  2. Select a folder via the file browser.
  3. Verify that all available documents are listed.
  4. Change the language and classificaiton settings of at least one document.
  5. Upload all files.
  6. Verify that all files are uploaded.
  7. Inspect a document and verify that the metadata was correctly set and the chunks collectively reproduce the document.
  8. Inspect the document for which the language and classification was changed and verify that metadata was correctly set.
  9. Add a document to the folder, modify a document, and delete another document. (external operation)
  10. Select the 'Sync Folder' icon again.
  11. Select the same folder as before via the file browser.
  12. Verify that only the added, modified, and deleted documents are listed.
  13. Upload all files.
  14. Verify that the added document is uploaded, the modified document was re-uploaded, and the deleted document removed.
  15. As a standard (non-admin) user, attempt to delete the entire collection.
  16. As admin, delete the entire collection.
  17. Verify the collection no longer appears in the collection listing, in query results, or in any tenant's access-grant listing.
  18. Inspect the logs (admin dashboard > Logging) to check that the synced documents' ingestion/update/removal, the denied non-admin deletion attempt, and the actual collection deletion each produced an audit entry.

  ## Expected outcome
  1. Folder synchronisation keeps track of changes (modification, addition, removal)
  2. Documents are successfully uploaded.
  3. Only an administrator may delete a collection; a standard user's attempt is denied.
  4. After collection deletion, the collection and all its document vectors, sparse-corpus data, and tenant access grants are removed from Qdrant and no longer appear in any listing, query, or access-grant response.
  5. The audit log contains a correctly-populated entry for the sync-driven document changes, the denied deletion attempt, and the collection deletion.
