text: |
  ## Preconditions and setup actions
  - hestIA is deployed with all pipeline services active
  - A test collection with ingested documents exists
  - Access to the Docker host is available to stop and restart the Qdrant service
  - A valid custom YAML workflow template is prepared and validated against the template schema
  - An analyst user is authenticated

  ## Test steps
  1. Submit a RAG query against the test collection. Confirm the response includes citations, verifying that the retrieval stage executed.
  2. Stop the Qdrant container (e.g. via `docker stop`). Submit another RAG query immediately.
  3. Confirm the response is an informative error message, not an empty or fabricated answer.
  4. Restart Qdrant and confirm the system resumes normal operation on the next query.
  5. Copy the custom YAML workflow template to hestia/templates/workflows/ and restart only the backend service.
  6. Invoke the new pipeline and confirm it executes without requiring code modifications.

  ## Expected outcome
  1. A successful RAG query confirms all pipeline stages (encode, retrieve, augment, generate) ran in sequence.
  2. With Qdrant unavailable, the system returns an error — not a hallucinated or empty response.
  3. After Qdrant restarts, queries succeed again.
  4. The new YAML workflow template takes effect after backend restart without any source code change.
