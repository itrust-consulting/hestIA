text: |
  ## Preconditions and setup actions
  - System deployed on a host with a supported GPU and the required drivers/runtime available to the container.

  ## Test steps
  1. Configure the embedding and generation services to use the GPU device.
  2. Start GPU utilization monitoring on the host (e.g., nvidia-smi).
  3. Ingest a document and observe GPU utilization during embedding generation.
  4. Submit a chat query and observe GPU utilization during text generation.
  5. Redeploy without GPU access (or disable the GPU configuration) and repeat document ingestion and a chat query.

  ## Expected outcome
  1. GPU utilization is observed during embedding generation and text generation when a GPU is configured and available.
  2. Ingestion and query processing complete successfully on CPU, without crashing, when no GPU is available.
