text: |
  ## Preconditions and setup actions
  - System initialized and user is logged in.
  - 'Ask My Doc' deactivated
  - TST-057 executed.
  - 'Enable auto-compaction' turned on, with a small context window and summary length configured (e.g. a few thousand tokens)

  ## Test steps
  1. Populate conversation to reach the context usage limit (see context usage ring in the input box).
  2. Remember a specific fact stated in earlier messages.
  3. Trigger auto-compacting by exceeding the context usage. 
  4. Ask a follow up question that requires recalling the fact noted in step 2.
  5. While at low context usage (<50%) trigger the manual compaction. 
  6. Verify that compaction is not triggered since usage is within budget.
  7. Continue populating the conversation to reach a usage of >85%. 
  8. Trigger the manual compaction.
  9. Verify that the compaction was triggered.
  10. Ask a follow up question that requires recalling a previous fact.

  ## Expected outcome
  1. The context usage ring reflects token usage as a proportion of the configured context window.
  2. Auto-compaction starts only with the submission of a new request once the context window is exceeded.
  3. Compaction process is visualised by a "Compacting..." label.
  4. Once compaction is finished the freed up space is displayed and the assistant response is generated.
  5. The full conversation history remains intact, unaltered, and scrollable after compaction -- 
  only the context sent to the LLM is affected, not the persisted/displayed messages.
  5. The assistant can still answer using information from turns that were folded away, based on the retained summary, 
  even if it no longer quotes them verbatim.
  6. Clicking the context usage ring manually triggers compaction immediately: if usage is already within budget it reports that nothing needed compacting, 
  otherwise it compacts and reports the freed tokens, consistent with auto-compaction.
  7. With auto-compaction disabled, usage keeps growing past the configured budget without any automatic fold, 
  and the ring reflects the uncapped usage; manual compaction via the ring remains available regardless of the setting.
