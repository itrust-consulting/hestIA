text: |
  ## Preconditions and setup actions
  - System initialized and user is logged in.
  - 'Ask My Doc' deactivated
  - TST-057 executed.
  - 'Enable auto-compaction' turned on, with a small context window and summary length configured (e.g. a few thousand tokens)

  ## Test steps
  1. Populate conversation to reach the context usage limit (see context usage ring in the input box).
  2. Remember a specific fact stated in earlier messages.
  3. Trigger auto-compacting by exceeding the context usage. 
  4. Ask a follow up question that requires recalling the fact noted in step 2.

  ## Expected outcome
  1. The context usage ring reflects token usage as a proportion of the configured context window, changing color as it fills (blue below ~60%, yellow between ~60-85%, red above ~85%).
  2. Auto-compaction only runs at the start of a turn whose incoming history is already over budget -- never mid-turn and never as a side effect of the reply that pushed the conversation over the limit; while it runs, the "Thinking" placeholder for that turn reads "Compacting…".
  3. Once the fold completes, the ring's usage drops accordingly and a toast confirms the conversation was compacted and how many tokens were freed.
  4. The full conversation history remains intact, unaltered, and scrollable after compaction -- only the context sent to the LLM is affected, not the persisted/displayed messages.
  5. The assistant can still answer using information from turns that were folded away, based on the retained summary, even if it no longer quotes them verbatim.
  6. Clicking the context usage ring manually triggers compaction immediately: if usage is already within budget it reports that nothing needed compacting, otherwise it compacts and reports the freed tokens, consistent with auto-compaction.
  7. With auto-compaction disabled, usage keeps growing past the configured budget without any automatic fold, and the ring reflects the uncapped usage; manual compaction via the ring remains available regardless of the setting.
