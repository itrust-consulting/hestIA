text: |
  ## Preconditions and setup actions
  - A clean host with Docker (and Docker Compose) installed, no prior hestIA containers or volumes present.

  ## Test steps
  1. Build and start hestIA using the repository's docker-compose.yml.
  2. Confirm both the backend and frontend containers reach a healthy/running state with no error output.
  3. Log in through the web interface.
  4. Ingest a document into a collection.
  5. Submit a chat query (both a plain and a RAG/"Ask My Doc" query) against that collection.
  6. Tear down and re-create the stack from the same compose file on the same host, without editing any configuration.

  ## Expected outcome
  1. hestIA deploys successfully via Docker Compose with no manual dependency installation beyond Docker itself.
  2. Login, document ingestion, and both query types complete with no errors.
  3. Tearing down and re-creating the stack from the same compose file reproduces the same working state.
