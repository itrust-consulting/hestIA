test_data: |
  A conversation belonging to the test user containing at least 7 messages (obtainable by submitting multiple POST /chat requests with save_chat=true and the same conversation_id, or equivalent seed data), so that a small page size (e.g. limit=3) forces at least three pages.
text: |
  ## Preconditions and setup actions
  - hestIA is deployed and the user is authenticated
  - The user has a conversation (`cid`) containing at least 7 messages

  ## Test steps
  1. Call `GET /conversations/{cid}?limit=3` with no cursor. Confirm the response is `{messages, has_more, next_cursor}`, `messages` contains exactly the 3 most recent messages in chronological order, `has_more` is `true`, and `next_cursor` is a `{created_at, rowid}` object.
  2. Call `GET /conversations/{cid}?limit=3` again, this time passing `before_created_at`/`before_rowid` from step 1's `next_cursor`. Confirm the response contains the next 3 older messages, none of which overlap with step 1's page, and that `has_more`/`next_cursor` are set appropriately for the remaining history.
  3. Repeat step 2, following each returned `next_cursor`, until a page reports `has_more=false`. Confirm that page's `next_cursor` is `null`.
  4. Concatenate all pages collected in steps 1-3 in chronological order. Confirm the result exactly matches the conversation's full message history (no duplicate messages, no gaps, no reordering) as returned by a single unpaginated call with a large `limit`.
  5. Call `GET /conversations/{cid}` with no query parameters. Confirm the default page size is applied and `has_more` correctly reflects whether the conversation exceeds it.
  6. Call `GET /conversations/{cid}?limit=0` and `GET /conversations/{cid}?limit=500`. Confirm both are rejected with `422 Unprocessable Entity` rather than being silently clamped or returning a server error.
  7. In the web UI, open the conversation and scroll to the top of the currently loaded history. Confirm older messages are fetched and prepended without the viewport jumping or losing scroll position. Continue scrolling down and away from the top for longer than the eviction grace period, then confirm the previously-loaded older messages have been released from memory (not re-fetched needlessly) and are transparently re-fetched without data loss if the user scrolls back up to them.

  ## Expected outcome
  1. First page returns the 3 newest messages with `has_more=true` and a valid `next_cursor`.
  2. Second page returns the next 3 older messages with no overlap with page 1.
  3. Paging continues until `has_more=false` is reached, at which point `next_cursor` is `null`.
  4. The full set of paged messages reconstructs the conversation's complete, correctly-ordered history with no duplicates or gaps.
  5. The default (unpaginated) call applies the configured default page size and reports `has_more` correctly.
  6. Out-of-range `limit` values are rejected with a validation error, not a server error or silent clamping.
  7. Scrolling up loads older history transparently and preserves scroll position; long-idle history is evicted from client memory and correctly reloaded on demand.
