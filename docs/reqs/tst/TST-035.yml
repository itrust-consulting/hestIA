text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin.
  - A non-administrator user account is available.

  ## Test steps
  1. Create a new help section with Markdown content.
  2. Upload an image and reference it in the section's Markdown.
  3. Rename the image and verify all Markdown references to it across all help sections are updated automatically.
  4. Update the help section's content and save changes.
  5. Log in as the non-administrator user and read the help section and image.
  6. As the non-administrator user, attempt to create, modify, or delete a help section or image.
  7. As admin, delete the help section and image.

  ## Expected outcome
  1. Help sections and images can be created, updated, and deleted by an administrator.
  2. Renaming an image atomically rewrites all Markdown references to it across all help sections.
  3. The non-administrator user can read sections and images but cannot create, modify, or delete them.
  4. Help sections are listed in a consistent order determined by their frontmatter metadata.
