text: |
  ## Preconditions and setup actions
  - System configured with AUTH_MODE=ldap, LDAP_HOST/LDAP_PORT/LDAP_SEARCH_BASE/LDAP_APP_DN/LDAP_APP_PASSWORD/LDAP_USER_DN_TEMPLATE set to a reachable directory.
  - A test user account exists in that LDAP directory.

  ## Test steps
  1. Log in using the LDAP test user's directory credentials.
  2. Log out, then attempt to log in with an incorrect password for the same LDAP user.
  3. Attempt to log in with a username that does not exist in the directory.

  ## Expected outcome
  1. A valid LDAP user is authenticated and granted access to the system.
  2. An incorrect password for a valid LDAP user is rejected with a clear error.
  3. A non-existent LDAP username is rejected with a clear error.
