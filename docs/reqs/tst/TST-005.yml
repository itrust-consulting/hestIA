text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running
  - An admin account is available
  - A standard user account exists, assigned to an organization with classification level 1 (INTERNAL)
  - A test collection exists containing documents at classification levels 1 and 3, owned by the standard user's organization
  - A moderator account exists for one organization; a second separate organization also exists
  - All accounts have known credentials

  ## Test steps
  1. Log in as the standard user. Attempt to access an admin-only function (e.g. user creation). Confirm access is denied.
  2. As the standard user, submit a query against the test collection. Inspect the citations and confirm only INTERNAL-classified content appears; CONFIDENTIAL content must not be present.
  3. Log in as admin. Submit the same query. Confirm content at all classification levels is returned.
  4. Log in as the moderator of organization A. Attempt to add a member to organization B. Confirm this is denied.

  ## Expected outcome
  1. Standard users cannot access administrative functions.
  2. A user with classification level 1 receives only content classified at level ≤ 1; higher-classified content is filtered out.
  3. Admin users have unrestricted access to all collections and classification levels.
  4. Moderators cannot manage organizations outside their own scope.
