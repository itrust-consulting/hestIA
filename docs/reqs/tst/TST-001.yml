text: |
  ## Preconditions and setup actions
  - A fresh host with no prior hestIA containers, volumes, or data directories present.
  - .env configured with DEFAULT_ADMIN_USERNAME, DEFAULT_ADMIN_PASSWORD, DEFAULT_ADMIN_EMAIL, AUTH_MODE=local, AUTH_SECRET_KEY, and the database/vector-store connection settings required for a first boot.

  ## Test steps
  1. Prepare the environment: verify the .env file contains all variables required for a first boot, and that no user database, vector store, or data directory from a previous run exists.
  2. Boot hestIA for the first time.
  3. Call GET /health and GET /ready and inspect the response.
  4. Confirm the first-boot artefacts were created: the bootstrap admin user exists in the user database (derived from DEFAULT_ADMIN_USERNAME/PASSWORD/EMAIL), and the default workflow/template configuration has been seeded into the data directory.
  5. Navigate to http://localhost:5173 and log in using the DEFAULT_ADMIN_* credentials.
  6. Submit a plain chat request with no collection selected (non-RAG).
  7. Create a collection, ingest a document into it, and submit a query against that collection with 'Ask My Docs' active (RAG).
  8. Log out, then attempt to access a protected page.
  9. Inspect the logs (admin dashboard > Logging) to check that the login, the document ingestion, and the logout each produced a correctly-populated audit entry (actor, action, resource, timestamp, correlation ID).

  ## Expected outcome
  1. GET /health and GET /ready both report a healthy/ready status, with the expected services and providers listed.
  2. The bootstrap admin user and default workflow templates are present after first boot; re-running boot does not recreate or duplicate them.
  3. Login succeeds with the provisioned default admin credentials.
  4. Both the non-RAG and the RAG request return valid responses; the RAG response includes a citation to the ingested document.
  5. Logout terminates the session; the protected page is no longer accessible and the user is redirected to login.
  6. The audit log contains a correctly-populated entry for the login, the ingestion, and the logout.
