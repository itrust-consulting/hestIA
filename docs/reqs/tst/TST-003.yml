text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running
  - VPN infrastructure is configured and accessible from an external network
  - A remote test host is available outside the local network
  - Valid user credentials are available for login

  ## Test steps
  1. From the remote host without VPN active, attempt to access the hestIA frontend URL. Note the result.
  2. Connect the remote host to the organizational VPN.
  3. Navigate to the hestIA frontend URL.
  4. Confirm the login page loads.
  5. Log in with valid credentials and confirm all features are accessible.

  ## Expected outcome
  1. hestIA is not reachable from outside the network without an active VPN connection.
  2. After connecting to the VPN, the hestIA web interface loads and all features are accessible.
  3. No changes to hestIA application configuration are required between steps 1 and 5.
