text: |
  ## Preconditions and setup actions
  - hestIA deployed and reachable only from the internal network (no public exposure), per the standard deployment.
  - A host connected to the organizational VPN, and a separate host with no VPN connection.

  ## Test steps
  1. From the VPN-connected host, connect to the organizational VPN and navigate to the hestIA frontend URL.
  2. Authenticate and use the chat and document interfaces normally.
  3. Confirm no hestIA application configuration was changed to enable this access (VPN routing is purely infrastructure-level).
  4. From the non-VPN host, without connecting to the VPN, attempt to reach the same hestIA URL.

  ## Expected outcome
  1. The hestIA web interface is fully usable from the VPN-connected host.
  2. No application-level configuration change was required to enable VPN access.
  3. The non-VPN host cannot reach hestIA directly.
