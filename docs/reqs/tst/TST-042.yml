text: |
  ## Preconditions and setup actions
  - System initialized and logged in as user.
  - A collection containing both content with an exact named-entity/technical-term match and content only conceptually related to a test query.

  ## Test steps
  1. Submit the query to /search with retrieval mode set to semantic; inspect the ranked results.
  2. Submit the same query to /search with retrieval mode set to keyword; inspect the ranked results.
  3. Submit the same query to /search with retrieval mode set to hybrid; inspect the ranked results.
  4. Submit the same query via /chat and via /generate, specifying the target collection, using each of the three modes in turn.

  ## Expected outcome
  1. Semantic mode ranks passages by vector similarity; conceptually related but non-exact-match passages can rank highly.
  2. Keyword mode ranks passages by BM25 term frequency; exact named-entity/technical-term matches rank highly.
  3. Hybrid mode returns a merged, re-ranked result set combining both signals, distinct from either mode alone.
  4. All three modes are accessible not only via /search but also via /chat and /generate when a collection is specified.
