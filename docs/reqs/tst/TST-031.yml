test_data: |
  Moderator account; admin account; a named test collection with at least two ingested documents with distinct, query-identifiable content; a tenant organisation with a collection grant.
text: |
  ## Preconditions and setup actions
  - hestIA is deployed with Qdrant active
  - A test collection exists with two ingested documents (document A and document B) with distinct content
  - A tenant organisation has a collection grant on the test collection

  ## Test steps
  1. As a moderator, submit a query that retrieves content from document A. Confirm document A appears in the citations.
  2. Call DELETE /collections/{name}/documents with the identifier for document A. Confirm 200 or 204.
  3. Submit the same query again. Confirm document A no longer appears in the results; document B remains retrievable.
  4. As admin, call GET /collections/{name}. Confirm the collection still exists and document B is present.
  5. As admin, call DELETE /collections/{name}. Confirm 200 or 204.
  6. Submit a query that would have retrieved document B. Confirm the collection no longer exists and no results are returned (404 or empty result).
  7. Confirm the tenant organisation's collection grant for the deleted collection is no longer present in GET /organizations/{org_id}/collections.

  ## Expected outcome
  1. Document A is retrievable before deletion.
  2. Document A deletion returns a success response.
  3. Document A is absent from results; document B is unaffected.
  4. Collection still exists after a single-document deletion.
  5. Collection deletion returns a success response.
  6. Post-deletion queries against the collection fail or return empty results.
  7. Tenant grants for the deleted collection are removed.
