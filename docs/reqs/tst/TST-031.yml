text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin

  ## Test steps
  1. Navigate to the admin dashboard > Workflows
  2. Select the 'Chat' workflow.
  3. Modify the workflow by adding nodes (see example below)
  4. Verify that workflow changes have been adopted.
  5. Restore the default 'Chat' workflow.
  6. Inspect the logs (admin dashboard > Logging) to check that both the workflow modification and its restoration produced an audit entry recording the acting admin, the action, and the affected workflow.

  EXAMPLE 'Chat' modification:

  entrypoint: Augment1
  exitpoints:
    - Chat1
  nodes:
    - id: Augment1
      type: Augment
      inputs:
        prompt: ${last_user_message}
        template: >
          After your normal answer, add a section titled VERIFICATION containing:

          1. Restated request: restate the user's request as a single testable
          condition.

          2. Assumptions: list any assumptions you made, or write “none”.

          3. Check: explain concretely why the answer satisfies the testable
          condition.

          4. Result: write either VERIFIED or NOT VERIFIED.


          <user_prompt>
            {user_prompt}
          </user_prompt>
      outputs:
        prompt: prompt
      position:
        x: 38.54457364341084
        y: -13.114341085271327
    - id: Chat1
      type: Chat
      inputs:
        history: ${history}
        last_user_message: ?prompt
        model: ${model}
        options: ${model_kwargs}
      outputs:
        response: response
      position:
        x: 72
        y: 117
  edges:
    - - Augment1
      - Chat1


  ## Expected outcome
  1. New pipeline compositions can be introduced through configuration without modifying application source code.
  2. The audit log contains a correctly-populated entry for the workflow modification and its restoration.
verification_method: Test (T)
