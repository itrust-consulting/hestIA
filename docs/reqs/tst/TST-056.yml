text: |
  ## Preconditions and setup actions
  - System initialized and user is logged in.
  - 'Ask My Doc' deactivated

  ## Test steps
  1. Start a conversation ('New Chat').
  2. Ask any question.
  3. Rename the automatically generated conversation to 'First (Second) conversation' and refresh the page.
  4. Ask another question. 
  5. Retry last reply.
  6. Copy last reply.
  7. Delete the last reply and user message. 
  7. Start new conversation.
  8. Activate 'Ask My Docs' and select any available corpus.
  9. Repeat steps 2-7.
  8. Refresh page again.
  9. Verify that all operations persisted in both conversations.
  10. Delete a conversation and refresh page again.


  ## Expected outcome
  1. All operations persisted and messages are ordered correctly.
