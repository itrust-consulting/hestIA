text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin.
  - Users 'User' and 'Moderator' available in user database.

  ## Test steps
  1. Navigate to the admin dashboard > Tenants.
  2. Create a new tenant 'TEST'.
  3. Inspect new tenant and verify that information is correctly displayed.
  4. Modify tenant information and save changes.
  5. Verify that changes have been adopted.
  6. Add 'User' and 'Moderator' to the tenant.
  7. Assign 'User' role of member and 'Moderator' role of moderator.
  8. Execute TST-024 - TST-028, using the tenant state reached at step 7 (before the moderator-removal and tenant-deletion steps below).
  9. Remove moderator from tenant.
  10. Delete the tenant.
  11. Inspect the logs (admin dashboard > Logging) to check that the tenant's creation and modification, the role assignments, the moderator removal, and the tenant deletion each produced an audit entry.

  ## Expected outcome
  1. Only assigned tenant are visible to the moderator.
  2. All CRUD operations execute successfully.
  3. The audit log contains a correctly-populated entry for the tenant CRUD and role-assignment actions performed above.
