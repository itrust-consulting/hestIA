text: |
  ## Preconditions and setup actions
  - Source code access to the full application (audit and system logging call sites, request handlers, admin routers).

  ## Test steps
  1. Enumerate every call site of the audit and system logging facilities in the codebase.
  2. Enumerate the critical paths that must be logged per SRS-027: authentication, collection access decisions (including denials), document ingestion and deletion, and administrative changes (user/organization CRUD, role and classification changes, tenant/collection access grants, workflow configuration changes, log-level changes).
  3. For each critical path, confirm a corresponding log call exists on both the success and failure branches.
  4. For each confirmed log call, verify it captures the acting user, action, affected resource, timestamp, and correlation ID.
  5. Identify any critical path with no log call, or whose logging is gated behind a configuration flag that is disabled by default.
  6. Record all findings, including the file and line of each reviewed call site and any gap identified.

  ## Expected outcome
  1. Every critical path listed in SRS-027 has at least one corresponding logging call site, reachable on both success and failure.
  2. Each reviewed log call captures the required fields (actor, action, resource, timestamp, correlation ID).
  3. No critical path is silently unlogged, including via a default-disabled configuration flag.
  4. Any gap found is documented with file/line references for remediation.
