text: |
  ## Preconditions and setup actions
  - System initialized and logged in as user.
  - Collection available with documents in at least one of English, French, or German.

  ## Test steps
  1. Submit a query in French.
  2. Verify the response is generated in French.
  3. Repeat step 1-2 with an English query.
  4. Repeat step 1-2 with a German query.
  5. Submit a query in a language different from the ingested documents' language and verify retrieval still returns relevant results.

  ## Expected outcome
  1. A French, English, or German query each receives a response in the same language.
  2. Retrieval quality is not significantly degraded when the query language differs from the primary document language.
