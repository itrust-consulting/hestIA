text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running with all core services active
  - A test collection contains known documents with varied metadata (at least 3 distinct authors, 2 classification levels, 2 document types)
  - An analyst user account is available
  - The test question set and expected answers are documented in advance

  ## Test steps
  1. Submit a natural-language question whose answer exists in the corpus. Verify the response is grounded and includes at least one citation.
  2. Submit an out-of-scope question (no relevant content in corpus). Verify the system acknowledges the information is unavailable without fabricating an answer.
  3. Apply a metadata filter (e.g. restrict to documents by a specific author). Submit a query and verify only documents matching that filter appear in citations.
  4. Submit a structured query targeting a specific document type or attribute. Verify results are scoped accordingly.

  ## Expected outcome
  1. In-corpus questions return grounded answers with citations traceable to specific documents.
  2. Out-of-scope questions produce an honest acknowledgement, not fabricated content.
  3. Metadata filters correctly restrict the retrieval scope.
  4. Structured query syntax returns filtered results aligned with the specified attributes.
