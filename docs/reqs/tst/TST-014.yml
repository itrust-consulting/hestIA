text: |
  ## Preconditions and setup actions
  - Logged in as admin.
  - A test user account exists.

  ## Test steps
  1. Set the test user's account expiration (expires_at) to a timestamp a few minutes in the future.
  2. Confirm the user can log in and use the system normally before that timestamp.
  3. Wait until after the expiration timestamp and attempt to log in as the test user again.
  4. Set a tenant-role grant for the test user with a starts_at a few minutes in the future and no expiry; attempt to use that role's access before starts_at is reached.
  5. Wait until after starts_at and confirm the role grant is now active.

  ## Expected outcome
  1. Before expires_at, the user account functions normally.
  2. After expires_at, login (or continued access) is denied.
  3. Before starts_at, the role grant is not yet active and does not grant access.
  4. After starts_at, the role grant becomes active and grants the expected access.
