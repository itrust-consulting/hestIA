text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin.
  - Users 'User' and 'Moderator' available in user database.

  ## Test steps
  1. Navigate to the admin dashboard > Tenants.
  2. Create a new tenant 'TEST'.
  3. Inspect new tenant and verify that information is correctly displayed.
  4. Modify tenant information and save changes.
  5. Verify that changes have been adopted.
  6. Add 'User' and 'Moderator' to the tenant.
  7. Assign 'User' role of member and 'Moderator' role of moderator.
  8. Execute TST-061.

  ## Expected outcome
  1.
