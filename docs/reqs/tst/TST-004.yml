text: |
  ## Preconditions and setup actions
  - System initialized with AUTH_MODE=local.

  ## Test steps
  1. Without authenticating, attempt to access a protected feature (e.g., the chat interface) and observe the result.
  2. Log in using valid local credentials.
  3. Access the same protected feature.
  4. Log out, then attempt to log in again using an incorrect password for the same account.

  ## Expected outcome
  1. The protected feature is inaccessible before authentication.
  2. Valid credentials grant access to the system.
  3. Invalid credentials are rejected with a clear error message, and no access is granted.
