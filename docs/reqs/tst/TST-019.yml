text: |
  ## Preconditions and setup actions
  - System initialized and user is logged in.
  - 'Ask My Doc' deactivated
  - A second user account exists.

  ## Test steps
  1. Start a conversation ('New Chat').
  2. Ask any question.
  3. Rename the automatically generated conversation to 'First (Second) conversation' and refresh the page.
  4. Ask another question.
  5. Retry last reply.
  6. Copy last reply.
  7. Delete the last reply and user message.
  8. Start new conversation.
  9. Activate 'Ask My Docs' and select any available corpus.
  10. Repeat steps 2-7.
  11. Refresh page again.
  12. Verify that all operations persisted in both conversations.
  13. Delete a conversation and refresh page again.
  14. Create additional conversations until more than the configured maximum (default 20) exist for this user, then retrieve the conversation list.
  15. Log in as the second user and attempt to retrieve, rename, and delete one of the first user's conversations (e.g., by its known identifier).

  ## Expected outcome
  1. All operations persisted and messages are ordered correctly.
  2. The conversation list returns at most the configured maximum number of recent conversations (default 20), ordered by most recent activity.
  3. The second user cannot retrieve, rename, or delete a conversation belonging to the first user.
