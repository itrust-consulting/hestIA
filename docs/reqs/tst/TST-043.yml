text: |
  ## Preconditions and setup actions
  - hestIA deployed with locally hosted embedding and generation models (no external LLM/embedding API configured).
  - Network monitoring available on the host (e.g., packet capture, DNS query log, or firewall deny-log) covering all outbound traffic from the hestIA containers.
  - Optionally, a network policy or firewall rule blocking all outbound internet routes from the hestIA containers except to explicitly allowlisted internal services (database, vector store).

  ## Test steps
  1. Start network monitoring (or apply the outbound-blocking policy) before any hestIA activity.
  2. Ingest a document into a collection.
  3. Submit a natural-language query against that collection.
  4. Stop monitoring and review the captured traffic (or blocked-connection log) for the full ingestion + query cycle.

  ## Expected outcome
  1. Document ingestion and query processing complete successfully even with all outbound internet routes blocked.
  2. No requests to external hosts are observed during embedding generation or text generation.
  3. All observed network activity is limited to internal services (database, vector store) and, where applicable, the locally hosted model runtime.
