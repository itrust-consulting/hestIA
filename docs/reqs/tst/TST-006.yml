text: |
  ## Preconditions and setup actions
  - System configured with AUTH_MODE=oidc, OIDC_PROVIDER_URL/OIDC_CLIENT_ID/OIDC_CLIENT_SECRET/OIDC_SCOPES set to a reachable identity provider.
  - A test user account exists with the identity provider.

  ## Test steps
  1. Initiate login; verify redirection to the configured OIDC provider's login page.
  2. Authenticate with the provider using valid test-user credentials and complete the redirect back to hestIA.
  3. Attempt the same flow using invalid provider credentials.
  4. As admin, inspect the logs (admin dashboard > Logging) to check that both the successful and the failed OIDC login attempt produced an audit entry (actor, action, resource, timestamp, correlation ID).

  ## Expected outcome
  1. The login flow correctly redirects to the configured OIDC provider.
  2. On successful provider authentication, the user is redirected back and granted access to hestIA.
  3. Invalid provider credentials result in the provider rejecting the login; no hestIA session is created.
  4. The audit log contains a correctly-populated entry for both the successful and the failed login attempt.
