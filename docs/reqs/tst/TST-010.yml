text: |
  ## Preconditions and setup actions
  - Logged in as a standard user with a known current password.

  ## Test steps
  1. Navigate to the account/profile settings and select change password.
  2. Submit the change with an incorrect current password.
  3. Submit the change with the correct current password and a new password.
  4. Log out, then log back in using the new password.
  5. Attempt to log in using the old password.

  ## Expected outcome
  1. A change request with the wrong current password is rejected with a clear error; the password is not changed.
  2. A change request with the correct current password succeeds.
  3. The new password authenticates successfully.
  4. The old password no longer authenticates.
