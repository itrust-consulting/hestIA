text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin

  ## Test steps
  1. Navigate to the admin dashboard > Users
  2. Create a test user.
  3. Inspect test user and verify that information is correctly displayed.
  4. Modify user information and save changes.
  5. Verify that changes were successfully adopted.
  6. Delete test user.
  7. Verify that test user is no longer listed in the user overview.
  8. Inspect the logs (admin dashboard > Logging) to check that the user's creation, modification, and deletion each produced an audit entry recording the acting admin, the action, and the affected user.

  ## Expected outcome
  1. All users are listed in the overview.
  2. User information is correctly displayed (Profile information, activity, tenants)
  3. All CRUD operations sucessful.
  4. The audit log contains a correctly-populated entry for the user's creation, modification, and deletion.
