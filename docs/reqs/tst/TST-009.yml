text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running with the ingestion service active
  - A named test collection exists
  - A moderator account for the collection is available
  - The test folder contains 5 valid documents and 1 corrupted/unreadable file

  ## Test steps
  1. Trigger batch ingestion pointing to the test folder, specifying the target collection.
  2. Observe the ingestion output and note which files succeeded and which failed.
  3. Verify the corrupted file is reported as failed with a descriptive message.
  4. Query the collection with content-specific questions for each of the 5 valid documents. Confirm they are all retrievable.

  ## Expected outcome
  1. All 5 valid documents are ingested in a single batch operation.
  2. The corrupted file fails with a per-document error; the failure does not prevent ingestion of the remaining files.
  3. All successfully ingested documents contribute searchable content to the collection.
