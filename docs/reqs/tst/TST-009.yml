text: |
  ## Preconditions and setup actions
  - System configured with AUTH_MODE=oidc.
  - Test identity provider issues tokens with a role claim and an organization claim for at least two distinct test users.

  ## Test steps
  1. Configure OIDC_PROVIDER_URL, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_SCOPES, OIDC_ROLE_CLAIM/OIDC_ROLE_MAPPING, and OIDC_ORG_CLAIM/OIDC_ORG_MAPPING, and restart the service.
  2. Log in as a test user and confirm the role and organization derived from the token claims match the configured mapping.
  3. Log in as the second test user with a different claim value and confirm a different role/organization is assigned accordingly.
  4. Attempt an OIDC redirect to a URL not present in OIDC_REDIRECT_ALLOWLIST and confirm it is rejected.
  5. As admin, inspect the logs (admin dashboard > Logging) to check that both logins produced an audit entry.

  ## Expected outcome
  1. The configured OIDC settings take effect after restart without code changes.
  2. Role and organization assignment correctly follows OIDC_ROLE_MAPPING/OIDC_ORG_MAPPING based on the token's claims.
  3. A redirect target outside OIDC_REDIRECT_ALLOWLIST is rejected.
  4. The audit log contains a correctly-populated entry for both test users' logins.
