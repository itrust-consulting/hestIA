text: |
  ## Preconditions and setup actions
  - TST-025 executed.
  - No document has yet been ingested into the target collection, so its default (out-of-box) chunking strategy is still in effect.
  - At least one .docx file to be ingested contains a table.

  ## Test steps
  1. Select the 'Add document' icon.
  2. Import a .docx file (containing a table) without changing the chunking strategy.
  3. Set the metadata, including a Restricted classification level.
  4. (Optional) Set custom metadata fields.
  5. Upload the document.
  6. Inspect uploaded document.
  7. Verify that all set metadata are correctly displayed, the generated chunks collectively reproduce the document, the chunks are split section-by-section (the default strategy, one chunk per section, with no prior configuration change), the table is present as structured queryable content, and each chunk's citation surfaces its section heading.
  8. Submit a chat query whose answer lies in this document; verify the document's content is returned with a citation, and that the citation allows navigating to an adjacent chunk to see surrounding context.
  9. As a user without Restricted clearance, submit the same query and verify this document's content is not returned.
  10. Modify metadata (e.g., correct the title, or lower the classification level to one the lower-clearance user holds) and save changes.
  11. Verify that metadata has been adopted, and re-submit the lower-clearance user's query from step 9 to confirm retrieval now reflects the edited metadata.
  12. Import a .pdf file and repeat steps 3-7 (skipping the table/default-strategy checks, which are format-independent).
  13. Import an .xlsx file and repeat steps 3-7 (skipping the table/default-strategy checks).
  14. Import one file each of the remaining supported formats (.txt, .md, .csv, .json, .pptx) and verify each is ingested without error, with metadata extracted and chunks generated.
  15. Replace the .docx file and select the 'Sections only' chunking strategy via the UI chunking-strategy selector, without editing any source code or configuration file.
  16. Verify that the entire document was replaced (no duplicate chunks) and the chunks are split by sections.
  17. Replace the .docx file and select the 'Paragraphs & tables' chunking strategy via the same UI selector, again without editing any source code or configuration file.
  18. Verify that the entire document was replaced (no duplicate chunks) and the chunks are split by paragraphs and tables.
  19. As a standard (non-moderator) user, attempt to delete one of the ingested documents.
  20. As the moderator, delete all added documents.
  21. Submit the query from step 8 again and confirm it no longer returns the deleted document's content.
  22. Inspect the logs (admin dashboard > Logging) to check that each document ingestion, the metadata edit, the denied non-moderator deletion attempt, and the actual deletions each produced an audit entry.

  ## Expected outcome
  1. Documents in all supported formats (.docx, .pdf, .xlsx, .txt, .md, .csv, .json, .pptx) are correctly parsed and chunked according to the selected chunking strategy, defaulting to section-level splitting out of the box.
  2. Metadata is correctly extracted and assigned to each chunk, and edits to metadata are reflected in subsequent retrieval.
  3. Tables are extractable as structured, queryable content; citations surface each chunk's structural position (section heading); adjacent chunks can be linked to reconstruct surrounding context.
  4. Ingested content is queryable through the chat interface, and access is correctly gated by classification level.
  5. Only a moderator can delete a document; a standard user's attempt is denied.
  6. After deletion, no chunks remain in the Qdrant database and a live query no longer returns the deleted document's content.
  7. The audit log contains a correctly-populated entry for each ingestion, the metadata edit, the denied deletion attempt, and the actual deletions.
