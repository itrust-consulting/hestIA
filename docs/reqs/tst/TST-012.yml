text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running with the ingestion service active
  - A test collection exists
  - A moderator account and system administrator access to the chunking configuration are available
  - The default section-level chunking strategy is confirmed active in the configuration

  ## Test steps
  1. Ingest the 10-section test document using the default section-level strategy. Record the number of chunks reported.
  2. Update the chunking strategy in the system configuration to a second available strategy without modifying application source code.
  3. Re-ingest the same document.
  4. Record the new chunk count and compare it against the result from step 1.

  ## Expected outcome
  1. The default section-level strategy produces approximately 10 chunks (one per section).
  2. Changing the strategy to a different option and re-ingesting produces a measurably different chunk count or distribution.
  3. The configuration change takes effect without any modification to application source code.
