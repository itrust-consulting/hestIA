text: |
  ## Preconditions and setup actions
  - System running with default AUTH_MAX_ATTEMPTS (5) and AUTH_LOCKOUT_DURATION.
  - A valid test account whose correct password is known.

  ## Test steps
  1. Submit 5 failed login attempts for the test account in quick succession.
  2. Submit a 6th login attempt, using the correct password.
  3. Wait for the configured lockout duration to elapse, then log in again using the correct password.
  4. Change AUTH_MAX_ATTEMPTS and AUTH_LOCKOUT_DURATION to different values, restart, and repeat steps 1-3 to confirm the new values are honored.

  ## Expected outcome
  1. The 6th attempt (beyond the configured threshold) returns HTTP 429 Too Many Requests, even with the correct password.
  2. After the lockout window elapses, a correct-password login succeeds again.
  3. The threshold and window are configurable via deployment settings and take effect without code changes.
