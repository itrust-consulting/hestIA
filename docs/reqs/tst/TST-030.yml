text: |
  ## Preconditions and setup actions
  - System initialized and logged in as user.
  - User is member of tenant.
  - Tenant includes at least one non-empty collection.
  - User has sufficient domain knowledge.

  ## Test steps
  1. Activate 'Ask My Doc'.
  2. Select available collection.
  3. Submit a query in natural language.
  4. Verify that generated response are grounded in truth,
  i.e., include citations referncing retrieved sources.
  5. Submit another query that is completely foreign to the
  domain of the selected collection.
  6. Verify that the assistant declares that it does not have
  sufficient information to answer the question.
  7. Verify that the entire RAG pipeline was executed (Log inspection).
  8. Deactivate 'Ask My Doc' and submit a plain query with no collection selected.
  9. Verify the plain response carries no citations.
  10. Reactivate 'Ask My Doc', select a collection, then point the query at that collection while it is temporarily unreachable (e.g., the vector store is stopped or the collection is deleted mid-request).
  11. Verify the system's response to the unreachable-collection query.

  ## Expected outcome
  1. Relevant chunks are retrieved.
  2. Responses include citations identifing the sources.
  3. The sources can be inspected.
  4. A question with no relevant content in the collection produces
  a response that explicitly acknowledges the information is unavailable.
  5. The system does not generate answers from general knowledge
  when querying a collection.
  6. The logs show that the entire RAG pipeline was executed.
  7. A plain completion with no collection query contains no citations.
  8. A failure in the retrieval stage (unreachable knowledge base) returns an explicit error to the user rather than an empty or fabricated response.
