text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin
  - TST-023, steps 1-7 (tenant 'TEST' created, with 'User' and 'Moderator' added and assigned their roles).
  - Multiple tenants available (>2).

  ## Test steps
  1. Navigate to the admin dashboard > Collections.
  2. Create a collection 'Test-admin', assign ownership to a tenant and access permissions to 'TEST'.
  3. Verify that collection is created with the correct owner and correct access permissions for 'TEST'.
  4. Also verify that the collection is correctly listed in the owners profile under collections, and
  under accessible collections for 'TEST'.
  5. Navigate to 'Manage Access' and revoke access 'TEST'.
  6. Verify in 'TEST's profile that the collection is no longer listed under accessible collections.
  7. Reassign ownership to 'TEST'.
  8. Verify in the respective tenant profiles that ownership and access is correctly displayed.
  9. Log in as 'Moderator' and navigate to admin dashboard > Collections
  10. Verify that only 'TEST' collection is listed in the overview.
  11. Create another collection 'Test-moderator' assign ownership to 'TEST' and access permissions to another tenant.
  12. Verify that collection is created with the correct owner and correct access permissions.
  13. Navigate to 'Manage Access' and revoke access.
  14. Log back in as admin and open a collection owned by a tenant admin has never been added to, at a Restricted classification level; confirm admin can view and query its content without any explicit access grant.
  15. Attempt to assign a second moderator to tenant 'TEST' (which already has 'Moderator' assigned).
  16. Inspect the logs (admin dashboard > Logging) to check that the collection creations, the access grant and revocation, the ownership reassignment, and the rejected second-moderator assignment each produced an audit entry.

  ## Expected outcome
  1. Collection successfully created.
  2. Access to collection correctly assigned.
  3. Moderator role only sees assigned tenant's collections.
  4. Admin can view and query any collection at any classification level, regardless of tenant ownership or explicit access grants.
  5. Assigning a second moderator to a tenant that already has one is rejected.
  6. The audit log contains a correctly-populated entry for the collection and access-grant actions performed above.
