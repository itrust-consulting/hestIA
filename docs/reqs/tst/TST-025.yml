test_data: |
  An admin account with known credentials; a moderator account for scope-restricted listing verification.
text: |
  ## Preconditions and setup actions
  - hestIA is deployed with the admin account active
  - No pre-existing test user with the chosen username

  ## Test steps
  1. As admin, call POST /users/create with a new username, password, and role. Confirm 201 Created and that the returned user object matches the supplied values.
  2. Call GET /users as admin. Confirm the new user appears in the list.
  3. Call GET /users as a moderator. Confirm the list is scoped to members of the moderator's own organisation only.
  4. Call GET /users/user/{uid} as admin. Confirm the full user profile is returned.
  5. Call PATCH /users/user/{uid} as admin to update the user's display name. Confirm 200 OK and updated values.
  6. Trigger an admin password reset for the user. Confirm the must-change-password flag is set on the user record.
  7. Log in as the target user with the reset password. Confirm login succeeds and the system requires a password change before proceeding.
  8. As admin, deactivate the user account (set expiry to now). Attempt to log in as the deactivated user. Confirm login is rejected.
  9. As admin, call DELETE /users/user/{uid}. Confirm 200 or 204.
  10. Call GET /users/user/{uid}. Confirm a 404 Not Found is returned.

  ## Expected outcome
  1. User is created with correct attributes.
  2. User appears in the admin listing.
  3. Moderator listing is org-scoped.
  4. Full profile is returned for admin queries.
  5. Profile fields update correctly.
  6. Password reset sets the must-change-password flag.
  7. First login with reset password triggers a forced password change.
  8. Deactivated user cannot log in.
  9. Deletion succeeds.
  10. Deleted user returns 404.
