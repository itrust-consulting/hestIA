text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running with the ingestion service active
  - A named test collection exists and is accessible to the test moderator
  - A moderator account for the collection's owner organization is available
  - A standard user account (non-moderator) is also available for access control testing
  - Test documents contain known content suitable for query verification

  ## Test steps
  1. Using the moderator account, upload each supported format (DOCX, PDF, XLSX, XLSM, TXT, MD, CSV, JSON, PPTX) individually. Confirm each upload completes without error.
  2. Trigger a batch ingestion from the test folder. Confirm all supported files are processed in a single operation.
  3. Submit a query relevant to content from one of the ingested documents. Confirm the document appears in the citations.
  4. Set a classification level on one document during upload. Submit a query as a user without the required clearance. Confirm the document is not returned.
  5. Attempt to upload a document using the standard (non-moderator) user account. Confirm the upload is rejected.

  ## Expected outcome
  1. All nine supported formats are ingested without errors.
  2. Batch ingestion processes all files in the folder without individual upload calls.
  3. Ingested documents are immediately retrievable via natural-language queries.
  4. Classification level assigned at ingestion governs which users can retrieve the document's content.
  5. Upload is restricted to moderators and admin users.
