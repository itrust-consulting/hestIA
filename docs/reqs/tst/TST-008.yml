text: |
  ## Preconditions and setup actions
  - System configured with AUTH_MODE=ldap.
  - Test directory has at least two groups mapped via LDAP_GROUP_MAPPING to different hestIA roles.

  ## Test steps
  1. Configure LDAP_HOST, LDAP_PORT, LDAP_SEARCH_BASE, LDAP_APP_DN/LDAP_APP_PASSWORD, and LDAP_USER_DN_TEMPLATE, and restart the service.
  2. Log in as a user belonging to the first mapped group; confirm the corresponding hestIA role is assigned.
  3. Log in as a user belonging to the second mapped group; confirm the corresponding (different) hestIA role is assigned.
  4. Set LDAP_USE_SSL and confirm the connection to the directory still succeeds over the encrypted transport.

  ## Expected outcome
  1. The configured LDAP settings take effect after restart without code changes.
  2. A user's group membership, per LDAP_GROUP_FILTER/LDAP_GROUP_MAPPING, correctly determines their assigned hestIA role.
  3. Directory connectivity works correctly whether LDAP_USE_SSL is enabled or not.
