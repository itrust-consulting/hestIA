text: |
  ## Preconditions and setup actions
  - System configured with AUTH_MODE=local.

  ## Test steps
  1. Confirm the system is operating in local authentication mode (login form accepts credentials directly, no LDAP/OIDC redirect occurs).
  2. Attempt to start the service with AUTH_SECRET_KEY unset or shorter than the required minimum length.
  3. Restore a valid AUTH_SECRET_KEY (>= 32 characters) and restart the service.

  ## Expected outcome
  1. Login uses the local credential store directly, with no external redirect.
  2. The service refuses to start (or fails token operations) with a missing/too-short AUTH_SECRET_KEY.
  3. With a valid AUTH_SECRET_KEY, the service starts normally and local login succeeds.
