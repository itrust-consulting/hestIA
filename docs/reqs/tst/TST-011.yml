text: |
  ## Preconditions and setup actions
  - Logged in as admin.
  - A standard test user exists with a known password.

  ## Test steps
  1. Navigate to admin dashboard > Users and open the test user.
  2. Set a new password for the user via the admin reset action, without knowing their current password.
  3. Log out, then log in as the test user using the new password set by the admin.
  4. Attempt to log in as the test user using their old password.
  5. As a standard (non-admin) user, attempt to reset another user's password.
  6. As admin, inspect the logs (admin dashboard > Logging) to check that the admin's password reset was recorded as an administrative change, and that the denied non-admin attempt was also recorded.

  ## Expected outcome
  1. An administrator can set a new password for any user without knowing their current password.
  2. The user authenticates successfully with the admin-set password.
  3. The user's old password no longer authenticates.
  4. A non-admin user is denied when attempting to reset another user's password.
  5. The audit log contains a correctly-populated entry for the admin's password reset and for the denied non-admin attempt.
