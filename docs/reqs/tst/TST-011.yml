text: |
  ## Preconditions and setup actions
  - hestIA is deployed and running with the ingestion service active
  - A test collection exists
  - A moderator account is available
  - The test document structure is documented: exact section titles, heading levels, and table column names

  ## Test steps
  1. Ingest the structured test document into the test collection.
  2. Submit a query that targets content appearing exclusively in section 3 of the document. Verify the citation identifies section 3 and does not include content from other sections.
  3. Submit a query referencing the table by column name. Verify the retrieved chunk contains the table content in a structured representation (e.g. Markdown table).
  4. Inspect the citations from both queries and confirm each includes a structural position indicator (section heading or equivalent).

  ## Expected outcome
  1. Each distinct headed section produces a separate retrievable chunk; cross-section contamination is not observed.
  2. Table content is retrieved in structured form and is identifiable by column name.
  3. Every citation includes a structural anchor (section heading or similar) locating the chunk within the document.
  4. Chunk adjacency links (prev/next) are present in the stored payload, enabling context reconstruction.
