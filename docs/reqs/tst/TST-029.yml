text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin
  - ollama running, with both embedding and generation model

  ## Test steps
  1. Navigate to the admin dashboard > connections.
  2. Add a Ollama API Connection for generation and one for embedding.
  3. Activate the Ollama API Connections.
  4. Navigate to the chat interface and start a new conversation.
  5. Verify that the response is generated by the Ollama server (Log inspection).
  6. Navigate to the admin dashboard > collections.
  7. Create a new collection and upload a document.
  8. Verify that the Ollama embedding connection was used to embed the document chunks (Log inspection).
  9. (Optional) Reactivate the default (OpenAI API) connections.
  10. Set the generation temperature to its minimum value and submit the same prompt three times in separate requests.
  11. Adjust the generation parameters (model, temperature, maximum output length) to different values.
  12. Navigate back to the chat interface and continue conversation.
  13. Verify that generation parameters have been adopted (log inspection).

  ## Expected outcome
  1. Backend configuration changes are adopted live.
  2. Models are discoverable vie the interface.
  3. Chat works independently of selected backend.
  4. At minimum temperature, the three repeated submissions of the same prompt produce consistent output.
  5. Supplied generation parameters (model, temperature, maximum output length) are applied to the response.
