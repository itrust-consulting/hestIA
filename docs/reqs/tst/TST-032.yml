text: |
  ## Preconditions and setup actions
  - hestIA is deployed and the user is authenticated
  - A test collection with a known document and a corresponding test question are available

  ## Test steps
  1. Call POST /chat with the test question, the test collection, and stream=false. Confirm a complete JSON response is returned with the answer and citations.
  2. Call POST /chat with the same test question, the same collection, and stream=true. Confirm the response uses chunked transfer encoding or server-sent events (Content-Type: text/event-stream). Confirm the concatenated stream content matches the answer returned in step 1.
  3. Call POST /generate with a plain prompt and stream=false. Confirm a complete JSON response is returned.
  4. Call POST /generate with the same prompt and stream=true. Confirm a streaming response is returned and the assembled content matches step 3.
  5. Interrupt the streaming response mid-stream (close connection). Confirm the server handles the disconnection gracefully without an uncaught exception.

  ## Expected outcome
  1. Non-streaming chat returns a complete JSON response.
  2. Streaming chat returns incremental token chunks; assembled content matches the non-streaming answer.
  3. Non-streaming generate returns a complete JSON response.
  4. Streaming generate returns incremental chunks matching the non-streaming answer.
  5. Mid-stream disconnection is handled gracefully.
