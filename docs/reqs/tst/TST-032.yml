text: |
  ## Preconditions and setup actions
  - System initialized.
  - Valid user credentials available.

  ## Test steps
  1. Authenticate via the API to obtain an access token.
  2. Use the token to call a core feature (e.g., document ingestion or a query) through the API.
  3. Inspect the response and confirm it matches the documented API schema.
  4. Submit a request with invalid or missing parameters and verify the error response.
  5. Retrieve the API documentation and confirm the exercised operations are described.

  ## Expected outcome
  1. A valid token is issued and accepted by subsequent API calls.
  2. Core features are fully usable via the API without the web interface.
  3. API responses follow a consistent structure across endpoints.
  4. Error responses clearly describe what went wrong.
  5. API documentation describes all supported operations with their expected inputs and outputs.
