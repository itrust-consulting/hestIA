text: |
  ## Preconditions and setup actions
  - System initialized and user is logged in.
  - 'Ask My Doc' deactivated
  - TST-056 executed.

  ## Test steps
  1. Populate conversation with >30 message pairs (user message + assistant replies).
  2. Refresh the page (or reopen the conversation from the sidebar) and observe how many messages are rendered before scrolling.
  3. Scroll up towards the top of the message list.
  4. Keep scrolling up until reaching the very first message pair sent in the conversation.
  5. Scroll back down to the bottom of the conversation, then scroll partway back up and stop without reaching the top.
  6. Wait at least 20 seconds, then scroll back up to the top again.
  7. Activate 'Ask My Docs' and select any available corpus.
  8. Start a new conversation and repeat steps 1-6, including at least one question answered using retrieved document context (with citations).

  ## Expected outcome
  1. On initial load, only the most recent messages are rendered; the full conversation history is not loaded at once.
  2. As the user scrolls up, older messages load progressively and are prepended above the visible ones (infinite scroll, no manual pagination controls), until the first message pair is reached and no further loading occurs.
  3. All message pairs are present, in correct chronological order, with no duplicates or gaps, regardless of how far back the user scrolls.
  4. Re-scrolling to previously viewed history after it has been scrolled away from for a while (steps 5-6) still displays the correct, complete messages, with no data loss or visible corruption.
  5. With 'Ask My Docs' activated, pagination behaves identically (steps 1-4 above), and messages retrieved from documents (including citations) are preserved correctly when scrolled away from and reloaded.
