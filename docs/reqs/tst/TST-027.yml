text: |
  ## Preconditions and setup actions
  - TST-025
  - Among the files to be batch-uploaded, one is a corrupt/unparseable file (e.g., a truncated or non-conforming document).

  ## Test steps
  1. Select the 'Add document' icon.
  2. Select multiple files of any supported format, including the one corrupt/unparseable file.
  3. Select the 'Auto-upload' option.
  4. Verify that each valid document was uploaded and that the metadata was correctly extracted, in a single batch operation without individual uploads.
  5. Verify that the corrupt file did not block the rest of the batch, and that its failure is reported individually (not silently dropped or a whole-batch failure).
  6. Delete all uploaded files.
  7. Repeat step 1 & 2 (excluding the corrupt file).
  8. Select the 'Review each file' option.
  9. Set the metadata for each file and upload.
  10. Verify that each document was uploaded and the metadata correctly set.
  11. Inspect the logs (admin dashboard > Logging) to check that each successfully ingested document, and the failed corrupt-file ingestion, each produced an audit entry.

  ## Expected outcome
  1. All valid documents in a folder/selection are uploaded in a single batch operation, without requiring individual uploads, and metadata is set.
  2. A document that fails to process does not block the rest of the batch; its failure is reported per-document.
  3. Default classification and language are set to 'Internal' and 'English' respectively,
  when metadata could not be automatically extracted.
  4. The audit log contains a correctly-populated entry for each successful ingestion and for the failed corrupt-file ingestion.
