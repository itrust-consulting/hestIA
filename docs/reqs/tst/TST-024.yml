text: |
  ## Preconditions and setup actions
  - TST-023, steps 1-7 (tenant 'TEST' created, with 'User' and 'Moderator' added and assigned their roles; moderator not yet removed and tenant not yet deleted).
  - A third test user account, 'Invitee', exists but is not yet a member of any tenant, and its stored email is known.
  - Logged in as 'Moderator'.

  ## Test steps
  1. Navigate to admin dashboard > Tenants.
  2. Verify that only assigned tenant ('TEST') is listed in the overview.
  3. Inspect tenant 'TEST'.
  4. Modify tenant information and save changes.
  5. Verify that changes have been adopted.
  6. Invite 'Invitee' to the tenant, using their stored email.
  7. Verify that an invitation has been sent to 'Invitee' and is pending.
  8. Remove 'User' from tenant.
  9. Create collection 'Test-collection' via the tenant profile.
  10. Verify that collection was created and return to the tenant profile.
  11. Verify that the created collection is now listed under the tenants collections.
  12. Delete collection 'Test-collection' via the tenant profile.
  13. As admin, inspect the logs (admin dashboard > Logging) to check that the tenant modification, the invitation, the member removal, and the collection creation/deletion each produced an audit entry.

  ## Expected outcome
  1. Only assigned tenant are visible to the moderator.
  2. All CRUD operations execute successfully.
  3. Collection 'Test-collection' removed from Qdrant database.
  4. The audit log contains a correctly-populated entry for the tenant and collection actions performed above.
