test_data: |
  Two authenticated user accounts (user A and user B); a conversation belonging to user A with at least three messages.
text: |
  ## Preconditions and setup actions
  - hestIA is deployed and both user accounts are authenticated
  - User A has a conversation with at least three messages (obtainable by submitting multiple POST /chat requests with the same conversation_id)

  ## Test steps
  1. As user A, call GET /conversations/{cid} and note the message IDs from the response's `messages` array (the endpoint returns an object `{messages, has_more, next_cursor}`, not a bare array).
  2. Call DELETE /conversations/{cid}/messages/{mid} for the middle message. Confirm a 200 or 204 response.
  3. Call GET /conversations/{cid} again. Confirm only the targeted message is absent; all other messages remain intact and in order.
  4. As user B, attempt DELETE /conversations/{cid}/messages/{mid} on a message from user A's conversation. Confirm a 403 Forbidden or 404 Not Found response is returned.

  ## Expected outcome
  1. Message IDs are visible in the conversation history.
  2. Deletion returns a success response.
  3. Only the deleted message is absent; the remaining messages are unchanged.
  4. Cross-user deletion is rejected with 403 or 404.
