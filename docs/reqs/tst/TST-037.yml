text: |
  ## Preconditions and setup actions
  - System initialized and logged in as admin.
  - A standard user and a moderator account are available.

  ## Test steps
  1. Log in and out as the standard user.
  2. As the standard user, attempt to access a collection outside their granted tenant and observe the access denial.
  3. As the moderator, ingest a document and then delete it.
  4. As admin, change a user's role/classification, modify a tenant's collection access grant, edit a workflow configuration, and change the system log level.
  5. As admin, query the audit log via the API, filtering by time range and log type, and confirm the events from steps 1-4 are present with actor, action, resource, timestamp, and correlation ID — including the ingestion and deletion entries for the document deleted in step 3, referencing a resource that no longer exists.
  6. Export the filtered audit log (both ndjson and csv) and verify the exported content matches the queried entries.
  7. As the standard user, attempt to access the audit log query/export endpoint and verify access is denied.
  8. Confirm that the log query and export actions performed in steps 5-6 themselves produced audit entries.

  ## Expected outcome
  1. Authentication, access-denial, document ingestion/deletion, and administrative change events each produce a structured audit entry.
  2. Each audit entry records the acting user, action, affected resource, timestamp, and correlation ID.
  3. Audit log entries persist independently of the lifecycle of the resource they reference.
  4. An administrator can query and export the audit log, filtered by log type, level, and time range.
  5. A non-administrator user is denied access to the audit log query/export endpoint.
  6. Audit log query and export actions are themselves recorded as audit entries.
