text: |
  ## Preconditions and setup actions
  - hestIA is deployed with a locally hosted LLM inference server and embedding server (e.g. vLLM on port 8000)
  - Network monitoring is active and logging all outbound connections
  - All outbound internet routes are blocked at the network level
  - A test collection exists
  - A second LLM backend configuration (e.g. Ollama) is prepared in a separate .env variant
  - A moderator account is available for ingestion

  ## Test steps
  1. With outbound internet blocked, ingest the test document. Confirm ingestion completes successfully and the chunk count matches expectations.
  2. Submit a natural-language query against the ingested document. Confirm a response is returned.
  3. Inspect network monitoring logs. Confirm all embedding and generation requests were routed to the local inference server and no external hosts were contacted.
  4. Stop hestIA, switch to the second backend configuration (updating only .env), and restart. Confirm the system starts without errors.
  5. Repeat steps 1–2 with the second backend. Confirm equivalent functionality.

  ## Expected outcome
  1. Ingestion and query succeed with all outbound internet blocked.
  2. Network logs confirm zero requests to external inference APIs.
  3. The LLM backend switches between supported providers via configuration without source code changes.
  4. Embedding model selection via configuration takes effect after restart.
