text: |
  ## Preconditions and setup actions
  - System configured with a short AUTH_TOKEN_LIFETIME (e.g., 1 minute) for testing.
  - Logged in and holding a valid access token.

  ## Test steps
  1. Wait past the configured AUTH_TOKEN_LIFETIME without further activity, then access a protected feature.
  2. Log in again and, without waiting for expiry, log out.
  3. Attempt to reuse the token that was active before logout to access a protected feature.
  4. Restore AUTH_TOKEN_LIFETIME to a longer value and confirm normal session length.

  ## Expected outcome
  1. Once the token has expired, the protected feature is inaccessible and the user is prompted to re-authenticate.
  2. A token invalidated by logout is rejected immediately, even though it has not yet naturally expired.
  3. The session lifetime is configurable and takes effect without code changes.
