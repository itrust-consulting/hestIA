text: |
  # Web Interface Access

  As a user,
  I want to interact with hestIA through a web interface,
  so that I can work through a browser.

  1. User opens their browser and navigates to hestIA's exposed url, e.g., 'http://localhost:7860'
  2. hestIA and all its core functionalities are accessible via the exposed url.

  ### Rationale
  Both human-driven and machine-driven workflows must be supported for operational flexibility.
  The API also enables integration with other frontends, tools and automated testing pipelines.

  ### Acceptance criteria
  - All depending requirements implemented and tested successfully.
