text: |
  # Document Metadata Extraction and Management

  As a moderator,
  I want the system to automatically extract document metadata during ingestion and allow me to edit it at any time,
  so that documents are correctly identified, classified, and traceable throughout their lifecycle.

  1. Upload a document; the system extracts metadata (title, author, classification level, etc.) automatically.
  2. Review and correct the extracted metadata before confirming the upload.
  3. After ingestion, update specific metadata fields of an already-ingested document without re-ingesting it.

  ### Rationale
  Document traceability and correct classification require that metadata is captured at ingestion time. The ability to enrich or correct metadata after the fact supports ongoing governance workflows without forcing a full re-ingestion.

  ### Acceptance criteria
  - Document metadata (at minimum title and classification level) is extracted automatically during ingestion without requiring manual entry.
  - A moderator can review and correct extracted metadata before the document is committed to the collection.
  - A moderator can edit specific metadata fields of an already-ingested document without re-ingesting it.
  - Retrieval does consider edited metadata correctly.
