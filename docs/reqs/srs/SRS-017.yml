text: |
  # Multi-Step Pipeline Execution

  As a system administrator,
  I want AI workflows to execute as reliable multi-step pipelines with explicit error handling at each stage,
  so that failures are contained and reported rather than producing silent or incorrect results.

  1. Submit a query targeting a collection.
  2. The system executes the full pipeline in sequence: encoding, retrieval, augmentation, and generation.
  3. If any stage fails (e.g., the knowledge base is unreachable), the pipeline halts and returns an informative error.
  4. A new pipeline composition can be introduced without changing application source code.

  ### Rationale
  A graph-based execution model makes the RAG pipeline introspectable, extensible, and resilient. Explicit per-step error handling ensures that partial failures do not propagate into incorrect or hallucinated responses.

  ### Acceptance criteria
  - A query against a collection triggers all pipeline stages in the correct order; the response confirms retrieval occurred via citations.
  - A failure in any stage (e.g., the knowledge base is unreachable) returns an error to the user rather than an empty or fabricated response.
  - New pipeline compositions can be introduced through configuration without modifying application source code.
