text: |
  # Document Ingestion

  As a moderator,
  I want to upload documents to a named knowledge base,
  so that the content of those documents becomes available for AI-assisted natural-language queries.

  1. Upload documents in any of the supported file formats: DOCX, PDF, XLSX/XLSM, TXT, MD, CSV, JSON, PPTX.
  2. Support upload of individual documents and batches (folder ingestion).
  3. Optionally preview and edit parsed documents and extracted metadata before upload.
  4. Configure the chunking strategy.
  5. Set the document classification level.
  6. Automatically identify the document language, or set it manually.

  ### Rationale
  Ingestion is the prerequisite for all RAG query functionality. Supporting multiple formats, batch ingestion, metadata control, and correct classification assignment ensures the knowledge base is comprehensive, accurate, and access-controlled from the start.

  ### Acceptance criteria
  - Documents in all supported formats can be ingested into a named collection.
  - Batch ingestion from a folder processes all supported documents without requiring individual uploads.
  - Ingested documents are queryable through the chat interface after upload.
  - Document classification level is applied at ingestion time and governs which users can retrieve its content.
