text: |
  # REST API Access

  As a power user or system integrator,
  I want to interact with hestIA through a REST API,
  so that I can automate workflows or integrate hestIA directly with other tools.

  1. Authenticate and obtain an access token.
  2. Use the token to call any core feature through the API.
  3. Verify that responses are consistently structured and that errors include a clear description of what went wrong.

  ### Rationale
  Machine-driven workflows and integrations with other iTrust tools require programmatic access to all core capabilities, independent of the web interface.

  ### Acceptance criteria
  - API documentation is available and describes all supported operations with their expected inputs and outputs.
  - API responses follow a consistent structure across all endpoints.
  - All depending requirements are implemented and accessible through the API.
