text: |
  # Container-Based Deployment

  As a system administrator,
  I want to deploy hestIA using a container-based deployment (e.g., Docker or Kubernetes),
  so that deployment is reproducible across compatible on-premises hosts without manual dependency management.

  ### Rationale
  Container-based deployment reduces host dependency risk, enables consistent environment configuration across deployments,
  and supports the on-premises portability requirement of MRS-001.

  ### Acceptance criteria
  - hestIA deployable using Docker or Kubernetes
  - all core functionality works with no error (see MRS-001)
