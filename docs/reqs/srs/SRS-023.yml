text: |
  # Streaming Response Delivery

  As an analyst,
  I want to receive AI-generated answers as a token-by-token stream rather than waiting for the complete response,
  so that I can read the beginning of a long answer immediately and interrupt generation early if the response is already sufficient.

  1. Submit a query or generation request with streaming enabled.
  2. Read the response incrementally as tokens are generated.
  3. Interrupt the stream mid-response if the initial content already satisfies the query.

  ### Rationale
  Long AI-generated responses can take several seconds to complete. Streaming delivery improves perceived responsiveness by surfacing the first tokens within milliseconds of generation start, and allows early termination to save inference time.

  ### Acceptance criteria
  - A request with stream=true returns an HTTP response with chunked transfer encoding or Content-Type: text/event-stream, delivering tokens incrementally.
  - The complete content assembled from all stream chunks is semantically equivalent to the non-streaming response for the same input.
  - A mid-stream client disconnection is handled gracefully by the server without raising an unhandled exception.
