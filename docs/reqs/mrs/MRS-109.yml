acceptancecriteria: |
  Audit logs are written append-only and cannot be modified via the
  application API; a complete structured audit extract for a specified
  time window and principal can be produced by an authorised administrator;
  log integrity can be verified independently of the application.
active: true
comments: |
  Extends MRS-064 with tamper-evidence and structured extractability as
  explicit security properties. These are prerequisites for any incident
  investigation regardless of the specific regulatory framework that applies.
