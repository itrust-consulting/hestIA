acceptancecriteria: |
  A security review report covering authentication controls, authorization
  enforcement, and input validation of all external-facing endpoints is
  produced before each major release; all critical and high findings are
  resolved or formally accepted before release sign-off.
active: true
comments: |
  Review scope should include: JWT handling, access policy bypass scenarios,
  file upload input validation, and multi-tenant data isolation. Does not
  mandate a full penetration test for every release, but a structured review
  by someone not on the implementing team.
