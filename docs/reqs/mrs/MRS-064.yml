acceptancecriteria: |
  Access to and modifications of documents, collections, and system configuration
  are logged with the acting user, action, affected resource, and timestamp.
  Log entries are structured, retained independently of the referenced resource's
  lifecycle, and queryable and exportable by an authorised administrator, filtered
  at minimum by time range.
active: true
comments: |
  System logging additionally tags each log entry with a correlation ID shared
  across all log lines produced by the same request, and audit entries are
  retained for a defined minimum period.
coverage: 90
