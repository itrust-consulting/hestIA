acceptancecriteria: |
  Deployment documentation specifies encryption controls for storage and
  inter-component transport; operator confirms implementation prior to
  go-live and the confirmation is recorded.
active: true
comments: |
  Intentionally a deployment-level requirement rather than application-level.
  MRS-065 was correctly rejected because encryption is delegated to
  infrastructure (TLS, disk encryption, VPN). This requirement ensures those
  controls are formally mandated and auditable rather than implied. Satisfies
  NIS2 Art. 21(1)(h) and GDPR Art. 32(1)(a).
