normative: true
rationale: |
  GDPR Article 32 and NIS2 Article 21 encryption obligation; replaces the infrastructure delegation implicit in rejected MRS-065.
ref: ''
releasephase: beta
requirement: |
  The system's deployment guide shall mandate encrypted storage for all
  databases and encrypted transport between components, and shall specify
  the minimum required controls. Operator confirmation of compliance shall
  be a prerequisite for production deployment.
