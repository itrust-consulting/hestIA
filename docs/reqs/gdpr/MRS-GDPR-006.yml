acceptancecriteria: |
  Unauthenticated and unauthorised access is denied; all access events
  are recorded in the audit log and attributable to an identified user.
active: true
comments: |
  Access control implementation is specified in MRS-003, MRS-062, MRS-063.
  Audit logging is specified in MRS-064. This requirement captures those
  controls as a GDPR-derived obligation.
