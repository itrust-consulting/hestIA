acceptancecriteria: |
  A DPIA information package is available covering processing activities,
  data flows, security measures, and residual risks; package is sufficient
  for the controller to conduct the DPIA required by the trigger
  assessment in Annex A of the SCD.
active: true
comments: |
  The DPIA is conducted by the controller, not by itrust. itrust's
  obligation is to provide the technical and organisational information
  the controller needs. The DPIA trigger assessment in SCD Annex A
  determines that a DPIA is required for multi-entity deployments.
