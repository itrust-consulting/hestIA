stages:
  - test

backend-tests:
  stage: test
  image: python:3.13-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    # pandoc matches the runtime Dockerfile -- python-docx's OMML conversion
    # path needs the real binary, not just its "not installed" fallback.
    - apt-get update && apt-get install -y --no-install-recommends pandoc
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - pytest --cov=hestia --cov-report=term-missing --cov-report=xml --cov-fail-under=90
  coverage: '/TOTAL.*\s+(\d+)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'
